  # ---------------------------------------------------------------------------
  # Open Questions
  # ---------------------------------------------------------------------------
  - theme: open_questions
    id: undecided_decisions
    schema_path: open_questions.undecided_decisions
    question: "Any decisions you are explicitly punting for now? (List, or 'none'.)"
    hint: >
      Agents should treat these as decisions-still-to-make, not silence.
      EMIT TYPED ENTRIES, not bullets: each is a mapping
      {id: QUE-NNN, question, status: open, blocks: [...]} — the QUE counter
      (state.last_ids.QUE) is SHARED with parking_lot. Downstream stages gate
      on QUE ids (a question blocking an FR must be resolved before the FR is
      built); a plain bullet gives them nothing to reference or close. On an
      update flow, retrofit legacy bullets with the next QUE id +
      status: open.
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: med

  - theme: open_questions
    id: parking_lot
    schema_path: open_questions.parking_lot
    question: "Anything in the parking lot to revisit later? (Ideas, half-baked thoughts, optional.)"
    hint: >
      A safe place to capture ideas without committing to them. Same typed
      shape as undecided_decisions ({id: QUE-NNN, question, status} —
      ALWAYS status: deferred here, never blocks: a parked idea gates
      nothing; the validator warns below prd_version 2.0 and blocks from it),
      continuing the SAME QUE counter. This is where de-scoped feature ideas
      land now that there is no nice-to-have list (D2): when the features
      theme surfaces something out of scope, route it here as a QUE rather
      than dropping it.
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: med

  # ---------------------------------------------------------------------------
  # Conventions (run LAST — after open_questions — so the agent has the full
  # picture and can spot patterns that downstream stages must honor verbatim)
  # ---------------------------------------------------------------------------
  - theme: conventions
    id: conventions
    schema_path: conventions
    question: "Any binding cross-cutting conventions downstream stages must honor — naming/ID rules, schema-versioning policy, NFR-propagation maps, code-style invariants, etc.?"
    hint: >
      The whole `conventions` block, run as `nested_freeform` — but treat it
      as a deliberate SYNTHESIS PASS, not a single question. It runs last, once
      the agent has read the entire project, so it can spot the cross-cutting
      rules every downstream stage must honor verbatim (the biggest source of
      PRD-intent drift when left implicit). BEFORE proposing buckets, read
      `references/conventions-catalog.md` and reflect across all prior answers,
      every upstream ID family, and the project type — the same discipline as
      the FR scope-completeness sweep. Propose the buckets the project actually
      needs (artifact_ids, schema_versioning, nfr_propagation, code_style,
      testing_policy, severity rubrics, supply-chain policy, … — see the
      catalogue), draft each free-form body, user approves/iterates. The
      validator only type-checks the top-level mapping. Anti-padding holds:
      simple projects may have zero conventions. Conventions-rich projects
      legitimately run to a dozen-plus buckets — don't under-deliver here.
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: nested_freeform
