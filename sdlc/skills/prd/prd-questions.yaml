# =============================================================================
# prd-questions.yaml — Question inventory for the sdlc-prd skill
# =============================================================================
# This file is a *guide*, not a rigid script. The skill batches questions by
# theme (3–5 per batch), skips questions already answered by the project scan,
# and skips questions irrelevant to the detected project type.
#
# Field reference for each entry:
#   theme              — grouping label; matches a top-level key in PRD.yaml
#   id                 — unique slug, kebab-case
#   schema_path        — dotted path where the answer is written in PRD.yaml
#                        (e.g. "product_identity.name")
#   question           — the prompt shown to the user
#   hint               — why this matters for downstream agents (kept short)
#   suggested_answers  — 3–5 plausible options shown as a numbered list
#   free_text_allowed  — if true, a final "Other / type your own" option appears.
#                        If FALSE the answer is written as one of the suggested
#                        values: an "Other" reply is mapped to the closest one,
#                        the mapping is read back for confirmation, and the text
#                        goes to <schema_path>_rationale (interview-mechanics.md).
#   free_text_expected — if true, free text IS the designed answer: the suggested
#                        answers are templates or examples ("state your number",
#                        "ACR-NNN: <criterion>"), so a high free-text rate in the
#                        run telemetry is not a question_quality signal. The
#                        maintainer's digest (collect_lessons.py) honours it.
#   multi_select       — if true, the user may pick SEVERAL suggested answers
#                        (AskUserQuestion multiSelect: true) and the answer is
#                        written as a LIST at schema_path — never a scalar.
#   required           — true => must be answered (or explicitly nulled with a
#                        warning) before the skill can complete
#   required_if        — optional expression; when it evaluates true against
#                        already-answered fields, the question is promoted to
#                        required even if `required: false`. The agent must
#                        re-evaluate this at the start of each new theme batch.
#                        Reading: PROMOTION (canonical activation-vs-promotion definition: references/interview-mechanics.md).
#                        Examples below.
#   capture_rationale  — if true, after the choice, ask one follow-up:
#                        "In one sentence — why?". Stored at <schema_path>_rationale.
#   confidence_field   — if true, a sibling <schema_path>_confidence is written
#                        (most fields use this; set false to opt out)
#   importance         — one of `med | high | critical | nested_freeform`.
#                        Controls how the agent runs the interview for this
#                        question. Defaults to `med` if omitted.
#                        See `references/importance-flows.md`:
#                          * med             — single AskUserQuestion batch
#                                              entry, inferred suggestion at
#                                              position 1.
#                          * high            — own mini-section: agent drafts a
#                                              full answer, shows it, user
#                                              approves or iterates (max 3
#                                              rounds). For list[string] fields
#                                              the loop runs once per item with
#                                              a single clarifying challenge
#                                              round.
#                          * critical        — same as high but the agent
#                                              challenges every list item
#                                              against risks/gaps it sees, drafts
#                                              detail with explicit slots
#                                              (input/output/dependencies/edge
#                                              cases/why), and runs a dynamic
#                                              project-specific scope-completeness
#                                              sweep against the draft + upstream
#                                              answers before closing the list.
#                                              Full a→a-2→b→b-2→c→d→sweep
#                                              per-item state machine.
#                          * nested_freeform — for a Dict[str, Any] field whose
#                                              shape is project-defined. Agent
#                                              proposes named buckets it
#                                              inferred from prior answers, then
#                                              for each accepted bucket drafts a
#                                              free-form nested YAML body the
#                                              user approves or iterates on.
#                                              See "The nested_freeform flow"
#                                              section in importance-flows.md.
#                        Most fields stay `med`. Required list[string] fields
#                        and a few foundational narrative fields are `high`.
#                        `features` and `non_functional_requirements.other` are
#                        `critical` — they define the functional scope and the
#                        cross-cutting NFR set.
#                        `conventions` is the only `nested_freeform` field.
#
# Theme order below is the canonical interview order. Required themes are
# asked in batches via AskUserQuestion (2–4 questions per call); product_identity
# is intentionally LAST among required themes so the agent can synthesize
# name/slug/one_liner candidates from earlier answers instead of asking cold.
# For optional themes the agent offers a now/skip/todo gate before each batch.
# Within a theme, `high`/`critical` questions are *not* batched with others —
# they run as their own mini-section because their answer flow is multi-turn.
# =============================================================================

themes:
  - id: problem_opportunity
    title: "Problem & Opportunity"
    required: true
    description: "What hurts, and why fix it now?"

  - id: users_personas
    title: "Users & Personas"
    required: true
    description: "Who are we building for?"

  - id: use_cases
    title: "Use Cases & Jobs to Be Done"
    required: true
    description: "What jobs is the product hired to do?"

  - id: functional_requirements
    title: "Functional Requirements"
    required: true
    description: "What must, should, and won't the product do?"

  - id: technical_constraints
    title: "Technical Constraints"
    required: true
    description: "What stack, platform, deployment are we committed to?"

  - id: product_identity
    title: "Product Identity"
    required: true
    synthesis: true
    description: >
      What is this thing, in one breath? Asked LAST among required themes
      so the agent can synthesize name/slug/one_liner candidates from
      everything answered so far (problem, users, workflows, features, tech).

  - id: non_functional_requirements
    title: "Non-Functional Requirements"
    required: false
    description: "Performance, reliability, accessibility — the qualities."

  - id: data_model
    title: "Data Model"
    required: false
    description: "What data lives here, who owns it, how much?"

  - id: security_compliance
    title: "Security & Compliance"
    required: false
    description: "What protects users and the data they trust us with?"

  - id: business_model
    title: "Business Model"
    required: false
    description: "How (and whether) this makes money."

  - id: stakeholders
    title: "Stakeholders & Team"
    required: false
    description: "Who decides, who builds, who blocks?"

  # milestones theme REMOVED (D2) — no MVP/phase split; the 1–3-sentence MVP
  # narrative folds into product_identity.vision, de-scoped ideas into
  # parking_lot.

  - id: success_metrics
    title: "Success Metrics"
    required: false
    description: "How will we know it worked?"

  - id: risks_assumptions
    title: "Risks & Assumptions"
    required: false
    description: "What could go wrong, what are we betting on?"

  # --- 1.1 optional context blocks (adopted from the AICF meta-corpus PRD
  # schema). Each is now/skip/todo gated; a PRD that skips all seven is still
  # complete. The hints say which later skill reads the answer — several have
  # no consumer yet and are recorded so the obligation is not lost.
  - id: glossary
    title: "Glossary"
    required: false
    description: "The domain vocabulary every later stage reuses verbatim."

  - id: user_stories
    title: "User Stories"
    required: false
    synthesis: true
    description: >
      Persona-centred "As a …, I want …, so that …" narratives (USR-NNN),
      synthesized from personas, features and workflows already captured.

  - id: internationalization
    title: "Internationalization"
    required: false
    description: "Locales, default language, right-to-left support."

  - id: competitive_landscape
    title: "Competitive Landscape"
    required: false
    description: "Who else solves this, and why this product wins."

  - id: legal_and_terms
    title: "Legal & Terms"
    required: false
    description: "Which legal documents must ship with the product."

  - id: analytics_and_telemetry
    title: "Analytics & Telemetry"
    required: false
    description: "Product-level events to track (not infra logs/metrics)."

  - id: support_model
    title: "Support Model"
    required: false
    description: "How users get help once the product ships."

  - id: open_questions
    title: "Open Questions"
    required: false
    description: "What is still undecided?"

  - id: conventions
    title: "Conventions"
    required: false
    description: >
      Cross-cutting project conventions that downstream stages must honor
      verbatim — naming/ID schemes, schema-versioning policy, propagation
      rules from PRD fields into later artifacts, code-style invariants,
      etc. Asked LAST so the agent has the whole picture; the answer is a
      named-bucket map with project-defined sub-structure (Dict[str, Any]).
      Skip for simple projects that have no binding cross-cutting rules.

questions:

  # ---------------------------------------------------------------------------
  # Problem & Opportunity
  # ---------------------------------------------------------------------------
  - theme: problem_opportunity
    id: problem_statement
    schema_path: problem_opportunity.problem_statement
    question: "What user pain or unmet need does this product address? (1–3 sentences)"
    hint: "The grounding fact for every feature decision downstream."
    suggested_answers: []
    free_text_allowed: true
    required: true
    capture_rationale: false
    confidence_field: true
    importance: high

  - theme: problem_opportunity
    id: who_has_pain
    schema_path: problem_opportunity.who_has_pain
    question: "Who specifically feels this pain? (Pick one or more, or describe.)"
    hint: "Helps agents make persona-specific UX trade-offs."
    suggested_answers:
      - "End consumers"
      - "Small business operators"
      - "Engineers / developers"
      - "Internal team / coworkers"
      - "Enterprise IT buyers"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: true
    importance: med

  - theme: problem_opportunity
    id: current_workarounds
    schema_path: problem_opportunity.current_workarounds
    question: "How do affected people cope today? (Pick all that apply.)"
    hint: "Anchors the 'why-better-than-status-quo' argument."
    suggested_answers:
      - "Manual / spreadsheet work"
      - "Stitching together multiple existing tools"
      - "A direct competitor's product"
      - "Internal scripts or one-offs"
      - "They simply don't — the need goes unmet"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: true
    importance: med

  - theme: problem_opportunity
    id: why_now
    schema_path: problem_opportunity.why_now
    question: "Why is this the right moment to build this? (Optional — market shift, new tech, regulation, etc.)"
    hint: "Helps agents reason about urgency and competitive pressure."
    suggested_answers:
      - "New AI capability makes it possible"
      - "Regulatory change forces it"
      - "Competitor moved and we need to respond"
      - "Internal cost of status quo crossed a threshold"
      - "No specific trigger — just time to do it"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: med

  # ---------------------------------------------------------------------------
  # Users & Personas
  # ---------------------------------------------------------------------------
  - theme: users_personas
    id: primary_users
    schema_path: users_personas.primary_users
    question: "Who are the primary users? (Pick all that apply, or describe.)"
    hint: "Primary users define the default UX bias. Each item is stored as 'PER-NNN: <descriptor>' (e.g. 'PER-001: …') — IDs are assigned in collection order and let downstream artifacts (UX flows, API auth scopes, test users) cross-reference specific personas."
    suggested_answers:
      - "Software engineers / developers"
      - "Data analysts or scientists"
      - "Product / project managers"
      - "Designers"
      - "Non-technical end users"
    free_text_allowed: true
    required: true
    capture_rationale: false
    confidence_field: true
    importance: high

  - theme: users_personas
    id: secondary_users
    schema_path: users_personas.secondary_users
    question: "Any secondary users we should keep in mind? (Optional — pick or describe.)"
    hint: "Secondary users get acknowledged but not optimized for in v1. Same 'PER-NNN: <descriptor>' format; IDs continue the PER-NNN sequence from primary_users (if primary ends at PER-002, secondary starts at PER-003)."
    suggested_answers:
      - "Admins / IT operators"
      - "External auditors or compliance reviewers"
      - "Customer support agents"
      - "Executives consuming summaries"
      - "None right now"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: med

  - theme: users_personas
    id: user_goals
    schema_path: users_personas.user_goals
    question: "What does success look like for a user after using this? (Pick all that apply.)"
    hint: "Drives the framing of error states, success states, and CTAs. Each item is stored as 'GOL-NNN: <goal>' so UX/success-metrics agents can map flows and KPIs back to a specific goal."
    suggested_answers:
      - "Save significant time on a recurring task"
      - "Get an answer they couldn't easily get before"
      - "Coordinate with their team more reliably"
      - "Avoid a costly mistake"
      - "Have fun / feel delighted"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: med

  - theme: users_personas
    id: user_frustrations
    schema_path: users_personas.user_frustrations
    question: "What frustrates these users about today's options? (Pick all that apply.)"
    hint: "Pain points are sharp signals for what to over-invest in. Each item is stored as 'PAN-NNN: <pain>' so downstream agents can cite which pain a feature addresses."
    suggested_answers:
      - "Existing tools are too complex"
      - "Existing tools are too limited"
      - "They are too expensive"
      - "They don't integrate with the rest of the workflow"
      - "They are unreliable"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: med

  - theme: users_personas
    id: expertise_level
    schema_path: users_personas.expertise_level
    question: "Typical user expertise level in this domain?"
    hint: "Drives how much hand-holding the UX needs."
    suggested_answers:
      - "novice"
      - "intermediate"
      - "expert"
      - "mixed"
    free_text_allowed: false
    required: false
    capture_rationale: false
    confidence_field: true
    importance: med

  # ---------------------------------------------------------------------------
  # Use Cases & Jobs to Be Done
  # ---------------------------------------------------------------------------
  - theme: use_cases
    id: core_workflows
    schema_path: use_cases.core_workflows
    question: "What are the 3–7 happy-path workflows? (List them as short verb phrases.)"
    hint: "Each becomes a candidate feature surface and a test scenario. Stored as 'WKF-NNN: <workflow>' — test-strategy and UX agents reference these IDs when scoping coverage."
    suggested_answers: []
    free_text_allowed: true
    required: true
    capture_rationale: false
    confidence_field: false
    importance: high

  - theme: use_cases
    id: primary_jobs_to_be_done
    schema_path: use_cases.primary_jobs_to_be_done
    question: "What are the primary 'jobs' the product is hired to do? (JTBD format: 'When ___, I want to ___, so I can ___'.)"
    hint: "JTBD framing keeps agents from designing features in isolation from intent. Stored as 'JTB-NNN: <statement>' — features can cite which JTB they fulfil."
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: high

  - theme: use_cases
    id: secondary_jobs
    schema_path: use_cases.secondary_jobs
    question: "Any secondary jobs worth supporting? (Optional.)"
    hint: "Helps agents avoid accidentally blocking adjacent use cases. Same 'JTB-NNN: <statement>' format; IDs continue the JTB-NNN sequence from primary_jobs_to_be_done."
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: med

  - theme: use_cases
    id: edge_cases
    schema_path: use_cases.edge_cases
    question: "Any edge cases that must be handled gracefully from day one? (Pick or describe.)"
    hint: "Calling these out early prevents agents from treating them as afterthoughts. Stored as 'EDG-NNN: <edge case>' so test-strategy can build coverage per ID."
    suggested_answers:
      - "Offline use / poor connectivity"
      - "Very large inputs (>1GB / >100k items)"
      - "Concurrent users editing the same data"
      - "Untrusted user input / abuse"
      - "Long-running operations (minutes+)"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: med

  # ---------------------------------------------------------------------------
  # Functional Requirements
  # ---------------------------------------------------------------------------
  - theme: functional_requirements
    id: features
    schema_path: functional_requirements.features
    question: "What are the product's functional requirements? List the features it must do. Be verbose."
    hint: "One flat list — no must/should/could split (every consumer is built whole by /sdlc:code, so an economic MVP tier has no downstream consumer). Each item is stored as 'FR-NNN: <description>' (e.g. 'FR-001: …'); the ID is assigned automatically at approval and used for cross-stage traceability. A de-scoped or later idea that surfaces here is NOT dropped — route it to open_questions.parking_lot (a QUE-NNN, status: deferred — it is deferred scope, not a live decision) so it stays reviewable without inflating scope."
    suggested_answers: []
    free_text_allowed: true
    required: true
    capture_rationale: false
    confidence_field: false
    importance: critical

  - theme: functional_requirements
    id: out_of_scope
    schema_path: functional_requirements.out_of_scope
    question: "What is *explicitly out of scope*? (List, or skip.)"
    hint: "Crucial. Agents over-build when scope boundaries are vague. Stored as 'OOS-NNN: <non-goal>' so downstream agents can cite which OOS item rules out a proposed feature."
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    importance: high

  - theme: functional_requirements
    id: integrations_required
    schema_path: functional_requirements.integrations_required
    question: "Which external systems must this integrate with? (Pick or describe.)"
    hint: "Integrations drive auth, schema, and reliability requirements. Stored as 'INT-NNN: <integration target>' — arch/api/test agents reference specific integrations by ID."
    suggested_answers:
      - "GitHub / GitLab"
      - "Slack / Teams"
      - "Google Workspace"
      - "Stripe / payment processor"
      - "None"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: true
    importance: high

  - theme: functional_requirements
    id: ai_features
    schema_path: functional_requirements.ai_features
    question: "Any AI-powered capabilities planned? (Pick or describe.)"
    hint: "AI features have outsized cost, latency, and eval implications. Stored as 'AIF-NNN: <AI capability>' so downstream agents (arch, test) can scope eval suites and cost budgets per ID."
    suggested_answers:
      - "LLM chat / Q&A"
      - "Summarization / extraction"
      - "Embeddings / semantic search"
      - "Agentic workflows"
      - "None — no AI features"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: true
    importance: high

  # ---------------------------------------------------------------------------
  # Technical Constraints (rationale captured on stack-shaping fields)
  # ---------------------------------------------------------------------------
  - theme: technical_constraints
    id: primary_language
    schema_path: technical_constraints.primary_language
    question: "Primary programming language?"
    hint: "Determines available libraries, hiring pool, runtime characteristics."
    suggested_answers:
      - "python"
      - "typescript"
      - "javascript"
      - "go"
      - "rust"
      - "java"
      - "csharp"
      - "ruby"
      - "other"
      - "undecided"
    free_text_allowed: true
    required: true
    capture_rationale: true
    confidence_field: true
    importance: med

  - theme: technical_constraints
    id: framework
    schema_path: technical_constraints.framework
    question: "Primary framework(s), if any? (Pick or describe.)"
    hint: "Frameworks lock in many downstream decisions; worth surfacing early."
    suggested_answers:
      - "React / Next.js"
      - "Vue / Nuxt"
      - "Svelte / SvelteKit"
      - "Django / FastAPI / Flask"
      - "Rails"
      - "None / standard library only"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: true
    importance: med

  - theme: technical_constraints
    id: runtime_platform
    schema_path: technical_constraints.runtime_platform
    question: "Where does the product run? Pick EVERY platform it ships on."
    hint: >
      Written as a LIST — e.g. [mobile_ios, mobile_android]; a single platform
      is still [cli]. ux derives its surface family from it, api narrows
      api_kind, arch pre-fills the deployment shape. `undecided` only ever
      stands alone. cli/tui are terminal surfaces; `service` is a network
      service with no UI of its own; `library` ships as a dependency.
    suggested_answers:
      - "web"
      - "mobile_ios"
      - "mobile_android"
      - "desktop"
      - "cli"
      - "tui"
      - "server"
      - "service"
      - "library"
      - "embedded"
      - "browser_extension"
      - "voice"
      - "other"
      - "undecided"
    free_text_allowed: true
    multi_select: true
    required: true
    capture_rationale: true
    confidence_field: true
    importance: med

  - theme: technical_constraints
    id: deployment_target
    schema_path: technical_constraints.deployment_target
    question: "Deployment target?"
    hint: "Affects every infra and ops decision downstream."
    suggested_answers:
      - "cloud_aws"
      - "cloud_gcp"
      - "cloud_azure"
      - "self_hosted"
      - "on_prem"
      - "edge"
      - "serverless"
      - "hybrid"
      - "local"
      - "cloud_managed"
      - "mobile_app_store"
      - "undecided"
    free_text_allowed: true
    required: false
    capture_rationale: true
    confidence_field: true
    importance: med

  - theme: technical_constraints
    id: existing_systems
    schema_path: technical_constraints.existing_systems
    question: "Any existing systems we must coexist with or migrate from? (Pick or describe.)"
    hint: "Coexistence constraints often dwarf greenfield design considerations."
    suggested_answers:
      - "Legacy in-house system"
      - "A specific SaaS product (describe)"
      - "Database we cannot replace yet"
      - "Identity provider (describe)"
      - "None — greenfield"
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: true
    importance: med

  - theme: technical_constraints
    id: browser_support
    schema_path: technical_constraints.browser_support
    question: "Browser support requirements? (Web only — skip if not web.)"
    hint: "Directly informs polyfills, CSS, and bundler config."
    suggested_answers:
      - "Modern evergreen only (last 2 versions)"
      - "Chrome + Firefox + Safari latest"
      - "Including Safari 14+"
      - "Including IE11 (legacy enterprise)"
      - "Not applicable"
    free_text_allowed: true
    required: false
    required_if: "'web' in runtime_platform"
    capture_rationale: false
    confidence_field: false
    importance: med

  # ---------------------------------------------------------------------------
  # Product Identity (asked LAST among required themes — synthesized from
  # everything answered above; the agent should propose all candidates as
  # ⚠ inferred position-1 options in AskUserQuestion, not ask cold)
  # ---------------------------------------------------------------------------
  - theme: product_identity
    id: idea_text
    schema_path: product_identity.idea_text
    question: "Original product brief — the free-text description you shared at the start."
    hint: "Preserved verbatim so downstream agents can refer to the founding idea without re-reading the interview transcript."
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    synthesis: true
    importance: med  # captured verbatim in Phase 3, no new input here

  - theme: product_identity
    id: name
    schema_path: product_identity.name
    question: "What is the product's name?"
    hint: "Used by downstream agents in copy, branding, and code identifiers."
    suggested_answers: []
    free_text_allowed: true
    required: true
    capture_rationale: false
    confidence_field: true
    synthesis: true
    importance: med

  - theme: product_identity
    id: slug
    schema_path: product_identity.slug
    question: "Preferred URL/package slug? (kebab-case)"
    hint: "Used for repo names, package names, URL paths."
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: true
    synthesis: true
    importance: med

  - theme: product_identity
    id: one_liner
    schema_path: product_identity.one_liner
    question: "Describe the product in one sentence (≤ 140 chars), as if to a smart friend who doesn't work in your industry."
    hint: "Used everywhere: docs intros, README headers, agent context."
    suggested_answers: []
    free_text_allowed: true
    required: true
    capture_rationale: false
    confidence_field: true
    synthesis: true
    importance: med

  - theme: product_identity
    id: tagline
    schema_path: product_identity.tagline
    question: "Marketing tagline (optional). Punchy, ≤ 8 words."
    hint: "Optional. Skip if you don't have one yet."
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    synthesis: true
    importance: med

  - theme: product_identity
    id: vision
    schema_path: product_identity.vision
    question: "Where is this product going in 1–3 years? (1–3 sentences)"
    hint: "Vision shapes architectural choices that have long horizons."
    suggested_answers: []
    free_text_allowed: true
    required: false
    capture_rationale: false
    confidence_field: false
    synthesis: true
    importance: med

  - theme: product_identity
    id: mission
    schema_path: product_identity.mission
    question: "What does this product do for users today? (1–3 sentences)"
    hint: "Mission is what the product IS now; vision is where it's going. Used by agents for onboarding copy and feature rationale."
    suggested_answers: []
